spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/librarydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:local-development-jwt-secret-change-before-deploy}
server:
  port: ${SERVER_PORT:8081}
app:
  loan:
    duration-days: 14