spring:
  datasource:
    url: jdbc:h2:mem:library-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: test-only-jwt-secret-with-at-least-32-characters
app:
  loan:
    duration-days: 14
