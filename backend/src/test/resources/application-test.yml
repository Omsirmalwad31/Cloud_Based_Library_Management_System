spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Library}
    username: ${SPRING_DATASOURCE_USERNAME:lib}
    password: ${SPRING_DATASOURCE_PASSWORD:lib123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: test-only-jwt-secret-with-at-least-32-characters
app:
  loan:
    duration-days: 14
